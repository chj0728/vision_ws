# 人体检测 + 距离
yolo_pipeline:
  enable: true
  yolo_engine_name: yolo26m_fp16.engine
  yolo_engine_path: ""
  conf_threshold: 0.45 # YOLO 检测置信度阈值
  max_distance_m: 3.5 # 最大距离（米），超出该距离的不输出人体检测框
  depth_scale_to_meters: 0.001 # 深度图像到米的缩放比例
  min_depth_m: 0.08 # 最小深度（米）
  max_depth_read_m: 25.0 # 最大可读取深度（米）
  only_human_class: true # 是否仅检测人体类别
  distance_ema_enable: false # 是否启用平滑距离EMA，平滑距离 = alpha × 当前距离 + (1 - alpha) × 历史平滑距离
  distance_ema_alpha: 0.35 # 距离 EMA 平滑系数
  human_class_id: 0 # 人体类别 ID
  depth_roi_y0: 0.52 # 深度 ROI 起始 Y 坐标（归一化）
  depth_roi_y1: 0.98 # 深度 ROI 结束 Y 坐标（归一化）
  depth_roi_x_margin: 0.2 # 深度 ROI X 方向边距（归一化）
  depth_percentile: 0.5 # 深度百分位数
  depth_trim_close_ratio: 0.0 # 深度裁剪近端比例
  bbox_coord_space: letterbox # 边界框坐标空间
  engine_input_h: 0 # 引擎输入高度
  engine_input_w: 0 # 引擎输入宽度

# 人体框时序关联，不执行人脸识别。
iou_tracker:
  enable: true
  iou_threshold: 0.30 # 活跃轨迹匹配要求 IoU >= 此阈值
  max_age_frames: 20 # 连续失配超过 20 帧才标记失活；代码默认 30
  reid_window_seconds: 15 # 不活跃轨迹的 IoU 恢复窗口（整数秒），不使用外观 ReID 默认 30
  revive_iou_scale: 0.40 # 恢复要求 IoU > iou_threshold × 此系数

# 人脸检测 + 关键点
scrfd_pipeline:
  enable: true
  scrfd_engine_name: scrfd_2.5g_bnkps_shape640x640.engine # scrfd_2.5g_bnkps_shape640x640.engine, scrfd_2.5g_bnkps_shape640x640.trt
  scrfd_engine_path: ""
  preprocess: insightface # 人脸检测预处理方式
  prob_threshold: 0.38 # 人脸检测置信度阈值
  nms_threshold: 0.45 # 人脸检测 NMS 阈值
  person_head_height_ratio: 0.58 # 头肩基础 ROI 高度占裁后人体高度的比例
  person_head_width_pad_ratio: 0.24 # 左右各扩展的裁后人体宽度比例
  person_head_top_expand_ratio: 0.14 # 向上扩展的裁后人体高度比例
  face_roi_min_side: 48 # 头肩检测 ROI 最小边长（像素），不是输出人脸尺寸
  max_person_rois: 8 # 按人员顺序尝试的 ROI 数上限，无效或过小 ROI 也计数

# 消费 SCRFD 人脸框，输出 yaw、pitch、roll 头部姿态角。
sixdrepnet_pipeline:
  enable: true
  sixdrepnet_engine_name: SixDRepNet_fp16.engine # SixDRepNet_fp16.engine, sixdrepnet_fp16.trt
  sixdrepnet_engine_path: ""
  min_face_px: 36 # 最小人脸尺寸（像素）
  face_expand_ratio: 0.12 # 人脸框扩展比例

# 消费 SCRFD 五点关键点，并按 track_id 维护识别状态。
arcface_pipeline:
  enable: true
  arcface_engine_name: arcface_w600k_r50_fp16.engine # arcface_w600k_r50_fp16.engine, w600k_r50_b16_gpu0_fp16.engine
  arcface_engine_path: ""
  face_db_path: db/face_db.sqlite3 # 人脸库 SQLite 路径（不存在时自动创建）
  recog_threshold: 0.45 # 识别余弦相似度阈值
  auto_register: true
  min_face_px: 48 # 注册/识别最小人脸尺寸（像素）
  min_face_confidence: 0.75 # 注册/识别 SCRFD 最小置信度
  min_track_frames: 7 # 注册所需 track 最小稳定帧数，原 20
  embedding_buffer_size: 5 # 注册/首次识别所需积累 embedding 数
  recheck_interval_frames: 50 # 已识别 track 重验间隔（帧），原 150
  require_head_pose: false
  max_yaw_deg: 30.0
  max_pitch_deg: 25.0
