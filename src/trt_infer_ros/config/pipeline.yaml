# 人体检测 + 距离
yolo_pipeline:
  enable: true
  yolo_engine_name: yolo26m_fp16.engine
  yolo_engine_path: ""
  conf_threshold: 0.45
  max_distance_m: 5.0
  depth_scale_to_meters: 0.001
  min_depth_m: 0.08
  max_depth_read_m: 25.0
  only_human_class: true
  distance_ema_enable: false
  human_class_id: 0
  depth_roi_y0: 0.52
  depth_roi_y1: 0.98
  depth_roi_x_margin: 0.2
  depth_percentile: 0.5
  depth_trim_close_ratio: 0.0
  distance_ema_alpha: 0.35
  bbox_coord_space: letterbox
  engine_input_h: 0
  engine_input_w: 0

# 人体框时序关联，不执行人脸识别。
iou_tracker:
  enable: true
  iou_threshold: 0.30
  max_age_frames: 30
  reid_window_seconds: 30
  revive_iou_scale: 0.40

# 人脸检测 + 关键点
scrfd_pipeline:
  enable: true
  scrfd_engine_name: scrfd_2.5g_bnkps_shape640x640.engine
  scrfd_engine_path: ""
  preprocess: insightface
  prob_threshold: 0.38
  nms_threshold: 0.45
  person_head_height_ratio: 0.58
  person_head_width_pad_ratio: 0.24
  person_head_top_expand_ratio: 0.14
  face_roi_min_side: 48
  max_person_rois: 8

# 消费 SCRFD 五点关键点，并按 track_id 维护识别状态。
arcface_pipeline:
  enable: true
  arcface_engine_name: arcface_w600k_r50_fp16.engine
  arcface_engine_path: ""
  face_db_path: data/face_db.sqlite3
  recog_threshold: 0.45
  auto_register: true
  min_face_px: 64
  min_face_confidence: 0.75
  min_track_frames: 20
  embedding_buffer_size: 5
  recheck_interval_frames: 150
  require_head_pose: false
  max_yaw_deg: 30.0
  max_pitch_deg: 25.0
