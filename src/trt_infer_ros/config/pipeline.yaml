yolo_pipeline:
  enable: true
  yolo_engine_name: yolo26m_fp16.engine
  yolo_engine_path: ""
  conf_threshold: 0.45
  max_distance_m: 5.0
  depth_scale_to_meters: 0.001
  min_depth_m: 0.08
  max_depth_read_m: 25.0
  only_human_class: true
  distance_ema_enable: false
  human_class_id: 0
  depth_roi_y0: 0.52
  depth_roi_y1: 0.98
  depth_roi_x_margin: 0.2
  depth_percentile: 0.5
  depth_trim_close_ratio: 0.0
  distance_ema_alpha: 0.35
  bbox_coord_space: letterbox
  engine_input_h: 0
  engine_input_w: 0

scrfd_pipeline:
  enable: true
  scrfd_engine_name: scrfd_2.5g_bnkps_shape640x640.engine
  scrfd_engine_path: ""
  preprocess: insightface
  prob_threshold: 0.38
  nms_threshold: 0.45
  person_head_height_ratio: 0.58
  person_head_width_pad_ratio: 0.24
  person_head_top_expand_ratio: 0.14
  face_roi_min_side: 48
  max_person_rois: 8
